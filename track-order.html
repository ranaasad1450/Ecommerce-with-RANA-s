<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Track Your Order — RANA'S</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.track-page{max-width:620px;margin:70px auto;padding:0 18px}.track-card{background:var(--surface, #fff);border:1px solid var(--line, #e5e7eb);border-radius:22px;padding:28px;box-shadow:0 14px 40px #0000000d}.track-card h1{font-family:Sora,sans-serif;margin:0 0 8px}.track-card p{color:var(--muted,#667085);line-height:1.6}.track-form{display:grid;gap:14px;margin-top:22px}.track-form label{display:grid;gap:7px;font-weight:700}.track-form input{width:100%;padding:14px;border:1px solid var(--line,#d0d5dd);border-radius:12px;font:inherit}.track-result{margin-top:20px;padding:18px;border-radius:14px;background:var(--soft,#f7f8fa);display:none}.track-result.show{display:block}.track-status{font-size:1.25rem;font-weight:800;margin:8px 0}.track-error{color:#b42318}.track-hint{font-size:.9rem}
</style></head><body><div class="announce">RANA'S — Order Tracking</div><header class="site"><div class="container nav-wrap"><a href="index.html" class="logo"><span>RANA<b>'S</b></span></a><a class="btn btn-ghost" href="index.html">Back to Store</a></div></header>
<main class="track-page"><section class="track-card"><h1>Track Your Order</h1><p>Enter the Order Number shown after checkout and the same phone number used when placing the order.</p><form class="track-form" id="trackForm"><label>Order Number<input id="orderNumber" required placeholder="e.g. RS-123456" autocomplete="off"></label><label>Phone Number<input id="phone" required type="tel" placeholder="Your checkout phone number" autocomplete="tel"></label><button class="btn btn-primary btn-lg" id="trackBtn">Check Order Status</button></form><div class="track-result" id="result" aria-live="polite"></div><p class="track-hint">For privacy, order details are only shown when both Order Number and phone number match.</p></section></main>
<script src="supabase-config.js"></script><script src="track-order.js"></script></body></html>
