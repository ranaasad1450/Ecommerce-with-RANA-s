<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RANA'S — Set New Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top"><a href="index.html" class="brand">RANA<b>'S</b> <span>ADMIN</span></a></header>
<main class="wrap">
  <section class="panel login">
    <h1>Set New Password</h1>
    <p>Enter a new password for your admin account.</p>
    <form id="resetForm">
      <label>New password<input id="newPassword" type="password" minlength="6" required autocomplete="new-password"></label>
      <label>Confirm password<input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password"></label>
      <button class="btn primary" id="saveBtn">Update Password</button>
      <p class="message" id="resetMessage" role="status"></p>
    </form>
  </section>
</main>
<script src="supabase-config.js"></script><script src="reset-password.js"></script>
</body></html>
