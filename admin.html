<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RANA'S — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="top"><a href="index.html" class="brand">RANA<b>'S</b> <span>ADMIN</span></a><button id="logoutBtn" class="btn ghost" hidden>Log out</button></header>
<main class="wrap">
  <section class="panel login" id="loginPanel">
    <h1>Admin Login</h1><p>Sign in with the email and password already registered in Supabase.</p>
    <form id="loginForm">
      <label>Email<input id="email" type="email" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" id="loginBtn">Login</button>
      <button class="btn ghost" type="button" id="forgotBtn">Forgot password?</button>
      <p class="message" id="loginMessage" role="status"></p>
    </form>
  </section>
  <section id="dashboard" hidden>
    <div class="heading"><div><h1>Orders</h1><p>Customer orders saved from your RANA'S website.</p></div><button class="btn ghost" id="refreshBtn">Refresh</button></div>
    <div class="stats"><div class="panel"><span>Total orders</span><strong id="totalOrders">0</strong></div><div class="panel"><span>Pending orders</span><strong id="pendingOrders">0</strong></div></div>
    <div class="panel table-panel">
      <div class="table-scroll"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Delivery</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead><tbody id="ordersBody"><tr><td colspan="9">Loading orders…</td></tr></tbody></table></div>
      <p class="message" id="dashboardMessage" role="status"></p>
    </div>
  </section>
</main>
<script src="supabase-config.js"></script><script src="admin.js"></script>
</body></html>
